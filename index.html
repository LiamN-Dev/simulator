<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#16181d;--mute:#667085;--line:#e1e5ec;--accent:#4f46e5}
:root[data-theme=dark]{--bg:#0f1218;--panel:#181c25;--ink:#eef0f4;--mute:#97a0b0;--line:#272d3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{font-size:1.5rem;font-weight:800;flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.45rem .8rem}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.kbd{color:var(--mute);font-size:.8rem;margin-left:.5rem}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:1.5rem;max-width:1100px;margin:0 auto;padding:1.25rem}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{display:flex!important;overflow-x:auto;gap:.5rem}.side button{flex:none}}
.side{display:flex;flex-direction:column;gap:.35rem;align-self:start;position:sticky;top:5rem}
.side button{display:flex;align-items:center;gap:.6rem;text-align:left;border:0;background:none;padding:.6rem .75rem;border-radius:8px;font-weight:500}
.side button .dot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.side button.on{background:var(--c);color:#fff}
.side button.on .dot{background:#fff}
.due{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1.25rem}
.due h2{font-size:1.1rem;margin-bottom:.5rem}
.due a{display:flex;gap:.6rem;align-items:baseline;padding:.2rem 0;color:inherit;text-decoration:none}
.due a:hover b{text-decoration:underline}
.due small{color:var(--mute)}
.post{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:.9rem 1rem;margin-bottom:.75rem;display:flex;gap:1rem;align-items:center}
.post .body{flex:1;min-width:0}
.post h3{font-size:1.05rem;font-weight:600}
.post a.t{color:inherit;text-decoration:none}.post a.t:hover{text-decoration:underline}
.post p{margin:.2rem 0 0;color:var(--mute);font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.4rem;font-size:.8rem;color:var(--mute)}
.badge{border-radius:999px;padding:.05rem .6rem;font-weight:600;font-size:.75rem;color:#fff}
.t-doc{background:#2563eb}.t-slides{background:#d97706}.t-sheet{background:#16a34a}.t-quizlet{background:#4338ca}.t-video{background:#dc2626}.t-pdf{background:#be123c}.t-link{background:#64748b}
.pin{color:var(--accent);font-weight:600}
.empty{color:var(--mute);padding:2rem;text-align:center;border:1px dashed var(--line);border-radius:10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:1.25rem;width:min(92vw,460px)}
dialog::backdrop{background:rgba(10,12,18,.55)}
dialog h2{margin-bottom:.75rem}
label{display:block;font-size:.85rem;color:var(--mute);margin:.6rem 0 .2rem}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem}
.row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.err{color:#dc2626;font-size:.85rem;min-height:1.2rem;margin-top:.4rem}
#pal{width:min(92vw,560px);padding:0;overflow:hidden}
#pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:1rem;font-size:1.05rem;background:var(--panel)}
#pal ul{list-style:none;margin:0;padding:.4rem;max-height:50vh;overflow:auto}
#pal li{padding:.55rem .7rem;border-radius:8px;cursor:pointer;display:flex;gap:.6rem;align-items:center}
#pal li.sel,#pal li:hover{background:var(--bg)}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.req{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.req span{flex:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>ClassDeck</h1>
  <button class="btn" id="openPal">Search <span class="kbd">Ctrl K</span></button>
  <button class="btn" id="reqBtn">Request notes</button>
  <button class="btn" id="theme" aria-label="Toggle dark mode">Dark</button>
  <button class="btn" id="adminBtn">Admin</button>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Subjects"></nav>
  <main>
    <section id="adminBar" hidden style="margin-bottom:1rem;display:none">
      <button class="btn primary" id="addBtn">Add link</button>
      <button class="btn" id="reqList">View requests</button>
      <button class="btn" id="logout">Log out</button>
    </section>
    <section class="due" id="due" hidden><h2>Due next</h2><div id="dueList"></div></section>
    <section id="feed"></section>
  </main>
</div>

<!-- Command palette -->
<dialog id="pal"><input id="palIn" placeholder="Search every subject, unit, or title" autocomplete="off"><ul id="palList"></ul></dialog>

<!-- Admin login -->
<dialog id="loginD"><h2>Admin login</h2>
  <label for="pin">PIN</label><input id="pin" type="password" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="loginGo">Log in</button></div>
</dialog>

<!-- Add / edit post -->
<dialog id="postD"><h2>Add link</h2>
  <label>Subject</label><select id="pSubject"></select>
  <label>Title</label><input id="pTitle">
  <label>URL</label><input id="pUrl" type="url" placeholder="https://">
  <label>Unit (optional)</label><input id="pUnit" placeholder="Unit 3">
  <label>Description (optional)</label><textarea id="pDesc" rows="2"></textarea>
  <label>Due date (optional)</label><input id="pDue" type="date">
  <label style="display:flex;gap:.5rem;align-items:center"><input id="pPin" type="checkbox" style="width:auto"> Pin to Due next</label>
  <div class="err" id="postErr"></div>
  <div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="postGo">Publish</button></div>
</dialog>

<!-- Request notes -->
<dialog id="reqD"><h2>Request notes</h2>
  <label>Subject</label><select id="rSubject"></select>
  <label>What do you need?</label><textarea id="rText" rows="3" placeholder="Notes from Chapter 5, Tuesday's lecture"></textarea>
  <label>Date you missed (optional)</label><input id="rDate" type="date">
  <div class="err" id="reqErr"></div>
  <div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="reqGo">Send request</button></div>
</dialog>

<!-- Requests inbox (admin) -->
<dialog id="inboxD"><h2>Requests</h2><div id="inbox"></div><div class="row"><button class="btn" data-close>Close</button></div></dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = {doc:'Doc',slides:'Slides',sheet:'Sheet',quizlet:'Quizlet',video:'Video',pdf:'PDF',link:'Link'};
const state = { subjects: [], posts: [], active: 'all', admin: false };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* ----- Theme ----- */
function setTheme(t) { document.documentElement.dataset.theme = t; localStorage.theme = t; $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; }
setTheme(localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ----- Rendering ----- */
function postHTML(p, withAdmin) {
  const due = p.due_date ? new Date(p.due_date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '';
  return `<article class="post" style="--c:${esc(p.color)}">
    <div class="body">
      <h3><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a></h3>
      ${p.description ? `<p>${esc(p.description)}</p>` : ''}
      <div class="meta">
        <span class="badge t-${esc(p.link_type)}">${LABEL[p.link_type] || 'Link'}</span>
        <span>${esc(p.subject_name)}</span>${p.unit ? `<span>${esc(p.unit)}</span>` : ''}
        ${due ? `<span>Due ${due}</span>` : ''}${p.pinned ? '<span class="pin">Pinned</span>' : ''}
      </div>
    </div>
    <button class="btn" data-copy="${esc(p.url)}">Copy link</button>
    ${withAdmin ? `<button class="btn" data-pin="${p.id}">${p.pinned ? 'Unpin' : 'Pin'}</button><button class="btn" data-del="${p.id}">Delete</button>` : ''}
  </article>`;
}

function render() {
  $('#side').innerHTML = [{ slug: 'all', name: 'All subjects', color: '#64748b' }, ...state.subjects].map(s =>
    `<button style="--c:${esc(s.color)}" class="${state.active === s.slug ? 'on' : ''}" data-slug="${esc(s.slug)}"><span class="dot"></span>${esc(s.name)}</button>`).join('');
  const list = state.active === 'all' ? state.posts : state.posts.filter(p => p.subject_slug === state.active);
  $('#feed').innerHTML = list.length ? list.map(p => postHTML(p, state.admin)).join('')
    : `<div class="empty">No links here yet.${state.admin ? ' Use Add link to post the first one.' : ' Use Request notes to ask for something.'}</div>`;
  const opts = state.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('#pSubject').innerHTML = opts; $('#rSubject').innerHTML = opts;
  $('#adminBar').style.display = state.admin ? 'flex' : 'none';
  $('#adminBar').style.gap = '.5rem';
  $('#adminBtn').hidden = state.admin;
}

async function loadDue() {
  const rows = await api('/api/due-next');
  $('#due').hidden = !rows.length;
  $('#dueList').innerHTML = rows.map(p => {
    const d = p.due_date ? new Date(p.due_date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) : 'Pinned';
    return `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><small>${d}</small><b>${esc(p.title)}</b><small>${esc(p.subject_name)}</small></a>`;
  }).join('');
}

async function load() {
  [state.subjects, state.posts] = await Promise.all([api('/api/subjects'), api('/api/posts')]);
  render(); loadDue();
}

/* ----- Clicks ----- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.slug) { state.active = t.dataset.slug; render(); }
  if (t.dataset.copy) { await navigator.clipboard.writeText(t.dataset.copy); toast('Link copied'); }
  if (t.dataset.del && confirm('Delete this link?')) { await api('/api/posts/' + t.dataset.del, { method: 'DELETE' }); toast('Deleted'); load(); }
  if (t.dataset.pin) { const p = state.posts.find(x => x.id == t.dataset.pin); await api('/api/posts/' + p.id, { method: 'PATCH', body: { pinned: !p.pinned } }); load(); }
  if (t.dataset.done) { await api('/api/requests/' + t.dataset.done, { method: 'PATCH', body: { status: t.dataset.to } }); openInbox(); }
});

/* ----- Command palette ----- */
let sel = 0, results = [];
function paint() {
  $('#palList').innerHTML = results.length ? results.map((p, i) =>
    `<li class="${i === sel ? 'sel' : ''}" data-i="${i}"><span class="badge t-${esc(p.link_type)}">${LABEL[p.link_type] || 'Link'}</span><span>${esc(p.title)}</span><small style="margin-left:auto;color:var(--mute)">${esc(p.subject_name)}</small></li>`).join('')
    : '<li>No matches. Try a different keyword.</li>';
}
function search() {
  const q = $('#palIn').value.toLowerCase().trim();
  results = state.posts.filter(p => !q || [p.title, p.description, p.unit, p.subject_name].join(' ').toLowerCase().includes(q)).slice(0, 12);
  sel = 0; paint();
}
function openPal() { $('#pal').showModal(); $('#palIn').value = ''; search(); $('#palIn').focus(); }
$('#openPal').onclick = openPal;
$('#palIn').oninput = search;
$('#palIn').onkeydown = e => {
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, results.length - 1); paint(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); paint(); e.preventDefault(); }
  if (e.key === 'Enter' && results[sel]) window.open(results[sel].url, '_blank', 'noopener');
};
$('#palList').onclick = e => { const li = e.target.closest('li[data-i]'); if (li) window.open(results[li.dataset.i].url, '_blank', 'noopener'); };
$('#pal').onclick = e => { if (e.target.id === 'pal') $('#pal').close(); };
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } });

/* ----- Admin ----- */
$('#adminBtn').onclick = () => { $('#pin').value = ''; $('#loginErr').textContent = ''; $('#loginD').showModal(); $('#pin').focus(); };
$('#pin').onkeydown = e => { if (e.key === 'Enter') $('#loginGo').click(); };
$('#loginGo').onclick = async () => {
  try { await api('/api/admin/login', { method: 'POST', body: { pin: $('#pin').value } }); state.admin = true; $('#loginD').close(); toast('Logged in'); render(); }
  catch (e) { $('#loginErr').textContent = e.message; }
};
$('#logout').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); state.admin = false; render(); toast('Logged out'); };
$('#addBtn').onclick = () => { $('#postErr').textContent = ''; $('#postD').showModal(); };
$('#postGo').onclick = async () => {
  try {
    await api('/api/posts', { method: 'POST', body: {
      subject_id: +$('#pSubject').value, title: $('#pTitle').value, url: $('#pUrl').value, unit: $('#pUnit').value,
      description: $('#pDesc').value, due_date: $('#pDue').value || null, pinned: $('#pPin').checked } });
    ['#pTitle', '#pUrl', '#pUnit', '#pDesc', '#pDue'].forEach(s => $(s).value = ''); $('#pPin').checked = false;
    $('#postD').close(); toast('Published'); load();
  } catch (e) { $('#postErr').textContent = e.message; }
};

/* ----- Requests ----- */
$('#reqBtn').onclick = () => { $('#reqErr').textContent = ''; $('#reqD').showModal(); };
$('#reqGo').onclick = async () => {
  try {
    await api('/api/requests', { method: 'POST', body: { subject_id: +$('#rSubject').value, text: $('#rText').value, date_needed: $('#rDate').value || null } });
    $('#rText').value = ''; $('#rDate').value = ''; $('#reqD').close(); toast('Request sent');
  } catch (e) { $('#reqErr').textContent = e.message; }
};
async function openInbox() {
  const rows = await api('/api/requests');
  $('#inbox').innerHTML = rows.length ? rows.map(r => `<div class="req"><span><b>${esc(r.subject_name || 'General')}</b>: ${esc(r.text)}${r.date_needed ? ' (' + String(r.date_needed).slice(0, 10) + ')' : ''}</span>
    <button class="btn" data-done="${r.id}" data-to="${r.status === 'open' ? 'fulfilled' : 'open'}">${r.status === 'open' ? 'Mark fulfilled' : 'Reopen'}</button></div>`).join('')
    : '<div class="empty">No requests yet.</div>';
  if (!$('#inboxD').open) $('#inboxD').showModal();
}
$('#reqList').onclick = openInbox;

/* ----- Boot ----- */
api('/api/admin/me').then(r => { state.admin = r.admin; load(); }).catch(load);
</script>
</body>
</html>
