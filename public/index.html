<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Production Startup Sim</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #30363d; margin-bottom: 20px; }
    h1 { color: #f0f6fc; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
    .badge-live { background: #238636; color: #fff; }
    .badge-paused { background: #da3633; color: #fff; }

    /* Metrics Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
    .stat-card h4 { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .val { font-size: 1.3rem; font-weight: bold; color: #58a6ff; }
    .val-green { color: #3fb950 !important; }
    .val-red { color: #f85149 !important; }

    /* Progress Bar */
    .progress-container { background: #21262d; border-radius: 6px; height: 8px; overflow: hidden; margin-top: 8px; }
    .progress-fill { background: #238636; height: 100%; width: 0%; transition: width 0.4s ease; }

    /* Dashboard Layout */
    .dashboard { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    @media (max-width: 800px) { .dashboard { grid-template-columns: 1fr; } }

    /* Panels */
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .panel h3 { font-size: 1rem; color: #f0f6fc; margin-bottom: 12px; }

    /* Controls */
    input, button { font-size: 0.9rem; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; }
    input { width: 100%; margin-bottom: 8px; }
    button { cursor: pointer; background: #238636; border: none; font-weight: bold; color: white; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: #30363d; }

    /* Employees */
    .emp-card { background: #0d1117; border: 1px solid #21262d; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
    .emp-name { font-weight: bold; color: #79c0ff; }
    .emp-role { font-size: 0.8rem; color: #8b949e; }

    /* Activity Feed */
    #logs { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; height: 450px; overflow-y: auto; padding: 12px; font-family: monospace; }
    .log-item { padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 0.88rem; line-height: 1.4; }
    .log-item:first-child { color: #7ee787; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>🏢 AI Startup Office <span id="statusBadge" class="badge badge-live">LIVE</span></h1>
    <div>
      <button id="pauseBtn" class="btn-secondary" onclick="togglePause()">⏸ Pause Simulation</button>
    </div>
  </header>

  <!-- Metrics Bar -->
  <div class="stats-grid">
    <div class="stat-card">
      <h4>Bank Balance</h4>
      <div id="budgetVal" class="val">$0</div>
    </div>
    <div class="stat-card">
      <h4>Product Revenue</h4>
      <div id="revVal" class="val val-green">$0</div>
    </div>
    <div class="stat-card">
      <h4>Dev Expenses</h4>
      <div id="expVal" class="val val-red">$0</div>
    </div>
    <div class="stat-card">
      <h4>Current Stage</h4>
      <div id="stageVal" class="val" style="color: #f0f6fc;">-</div>
    </div>
    <div class="stat-card">
      <h4>Stage Progress</h4>
      <div id="progressVal" class="val">0%</div>
      <div class="progress-container"><div id="progressBar" class="progress-fill"></div></div>
    </div>
  </div>

  <div class="dashboard">
    <!-- Left Sidebar -->
    <div class="sidebar">
      
      <!-- Product Status -->
      <div class="panel">
        <h3>📦 Product & Sales Output</h3>
        <p style="font-size: 0.9rem; margin-bottom: 6px; color: #8b949e;">Idea: <strong id="ideaVal" style="color: #f0f6fc;">-</strong></p>
        <p style="font-size: 0.85rem; color: #8b949e;">Units Sold: <span id="unitsVal" style="color: #58a6ff;">0</span></p>
        <p style="font-size: 0.85rem; color: #8b949e;">Active Users: <span id="usersVal" style="color: #58a6ff;">0</span></p>
      </div>

      <!-- God Controls -->
      <div class="panel">
        <h3>⚡ God Mode Interventions</h3>
        <input type="text" id="godCmd" placeholder="e.g. 'Coffee machine broke' or 'A client wants 500 units'">
        <button onclick="sendGodCommand()" style="width: 100%; margin-bottom: 10px;">Trigger Event</button>
        <button onclick="addCash(10000)" class="btn-secondary" style="width: 100%;">💰 Inject +$10,000 Cash</button>
      </div>

      <!-- Hire Employee -->
      <div class="panel">
        <h3>👤 Hire Employee</h3>
        <input type="text" id="hireName" placeholder="Name (e.g. Sarah)">
        <input type="text" id="hireRole" placeholder="Role (e.g. Sales Director)">
        <button onclick="hireEmployee()" style="width: 100%;">Hire Staff</button>
      </div>

      <!-- Employees List -->
      <div class="panel">
        <h3>👥 Office Roster</h3>
        <div id="employeeList"></div>
      </div>

    </div>

    <!-- Right Feed Panel -->
    <div class="main-feed">
      <div class="panel">
        <h3>📡 Live Office Activity & Output Feed</h3>
        <div id="logs"></div>
      </div>
    </div>
  </div>

  <script>
    async function updateUI() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();

        // Header & Pause
        const badge = document.getElementById('statusBadge');
        const pauseBtn = document.getElementById('pauseBtn');
        if (data.isPaused) {
          badge.className = 'badge badge-paused';
          badge.innerText = 'PAUSED';
          pauseBtn.innerText = '▶ Resume Simulation';
        } else {
          badge.className = 'badge badge-live';
          badge.innerText = 'LIVE';
          pauseBtn.innerText = '⏸ Pause Simulation';
        }

        // Metrics
        document.getElementById('budgetVal').innerText = `$${data.budget.toLocaleString()}`;
        document.getElementById('revVal').innerText = `$${data.totalRevenue.toLocaleString()}`;
        document.getElementById('expVal').innerText = `$${data.totalExpenses.toLocaleString()}`;
        document.getElementById('stageVal').innerText = data.stage;
        document.getElementById('ideaVal').innerText = data.idea;
        document.getElementById('progressVal').innerText = `${data.progress}%`;
        document.getElementById('progressBar').style.width = `${data.progress}%`;

        // Product Output Stats
        document.getElementById('unitsVal').innerText = data.productStats.unitsSold.toLocaleString();
        document.getElementById('usersVal').innerText = data.productStats.activeUsers.toLocaleString();

        // Employees
        document.getElementById('employeeList').innerHTML = data.employees
          .map(emp => `
            <div class="emp-card">
              <div class="emp-name">${emp.name}</div>
              <div class="emp-role">${emp.role}</div>
            </div>
          `).join('');

        // Logs
        document.getElementById('logs').innerHTML = data.logs
          .map(log => `<div class="log-item">${log}</div>`)
          .join('');

      } catch (err) { console.error("Update failed:", err); }
    }

    async function togglePause() {
      await fetch('/api/admin/toggle-pause', { method: 'POST' });
      updateUI();
    }

    async function addCash(amount) {
      await fetch('/api/admin/add-cash', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount })
      });
      updateUI();
    }

    async function sendGodCommand() {
      const input = document.getElementById('godCmd');
      if (!input.value) return;
      await fetch('/api/admin/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: input.value })
      });
      input.value = '';
      updateUI();
    }

    async function hireEmployee() {
      const name = document.getElementById('hireName').value;
      const role = document.getElementById('hireRole').value;
      if (!name || !role) return;

      await fetch('/api/admin/hire', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role })
      });

      document.getElementById('hireName').value = '';
      document.getElementById('hireRole').value = '';
      updateUI();
    }

    setInterval(updateUI, 3000);
    updateUI();
  </script>
</body>
</html>
